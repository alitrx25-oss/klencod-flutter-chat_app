<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>لوحة تحكم الأدمن</title>
<style>
  :root { --bg:#f4f6f8; --card:#fff; --text:#1c1e21; --muted:#667781; --green:#128C7E; --red:#d93025; --line:#e3e6ea; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111b21; --card:#202c33; --text:#e9edef; --muted:#8696a0; --line:#2a3942; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, "Segoe UI", Tahoma, sans-serif; background:var(--bg); color:var(--text); }
  header { background:var(--green); color:#fff; padding:14px 20px; display:flex; justify-content:space-between; align-items:center; }
  main { max-width:1000px; margin:20px auto; padding:0 12px; }
  .card { background:var(--card); border-radius:12px; padding:16px; margin-bottom:16px; box-shadow:0 1px 3px rgba(0,0,0,.08); }
  .stats { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:12px; }
  .stat b { display:block; font-size:28px; color:var(--green); }
  .stat span { color:var(--muted); font-size:14px; }
  input { padding:10px; border:1px solid var(--line); border-radius:8px; width:100%; background:var(--card); color:var(--text); font-size:15px; }
  button { padding:8px 12px; border:0; border-radius:8px; cursor:pointer; font-size:13px; background:var(--green); color:#fff; }
  button.red { background:var(--red); } button.gray { background:#667781; }
  .table-wrap { overflow-x:auto; }
  table { width:100%; border-collapse:collapse; min-width:620px; }
  th, td { text-align:start; padding:10px 8px; border-bottom:1px solid var(--line); font-size:14px; }
  .av { width:36px; height:36px; border-radius:50%; background:var(--green); color:#fff; display:inline-flex; align-items:center; justify-content:center; overflow:hidden; vertical-align:middle; margin-inline-end:8px; }
  .av img { width:100%; height:100%; object-fit:cover; }
  .tag { padding:2px 8px; border-radius:20px; font-size:12px; background:var(--line); }
  .tag.red { background:var(--red); color:#fff; } .tag.green { background:var(--green); color:#fff; }
  #login { max-width:360px; margin:80px auto; } #login input { margin-bottom:10px; }
  #err { color:var(--red); font-size:14px; min-height:20px; }
</style>
</head>
<body>

<div id="login" class="card">
  <h2>دخول الأدمن</h2>
  <input id="email" type="email" placeholder="الإيميل">
  <input id="pass" type="password" placeholder="كلمة المرور">
  <div id="err"></div>
  <button id="loginBtn" style="width:100%">دخول</button>
</div>

<div id="app" hidden>
  <header><strong>لوحة تحكم الأدمن</strong><button class="gray" id="logoutBtn">خروج</button></header>
  <main>
    <div class="card stats">
      <div class="stat"><b id="sUsers">0</b><span>إجمالي المستخدمين</span></div>
      <div class="stat"><b id="sBanned">0</b><span>المحظورون</span></div>
      <div class="stat"><b id="sAdmins">0</b><span>الأدمن</span></div>
      <div class="stat"><b id="sChats">0</b><span>المحادثات</span></div>
    </div>
    <div class="card">
      <input id="search" placeholder="ابحث بالاسم أو الإيميل">
      <div class="table-wrap">
        <table>
          <thead><tr><th>المستخدم</th><th>الإيميل</th><th>الحالة</th><th>إجراءات</th></tr></thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </div>
  </main>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, doc, getDoc, getDocs, updateDoc, deleteDoc, query, orderBy, getCountFromServer } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// ضع إعدادات مشروعك هنا (Firebase Console > Project settings > Web app)
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  projectId: "YOUR_PROJECT",
  appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
let users = [];

$("loginBtn").onclick = async () => {
  $("err").textContent = "";
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("pass").value); }
  catch (e) { $("err").textContent = "فشل الدخول: " + e.code; }
};
$("logoutBtn").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  if (!user) { $("login").hidden = false; $("app").hidden = true; return; }
  const me = await getDoc(doc(db, "users", user.uid));
  if (!me.exists() || me.data().isAdmin !== true) {
    $("err").textContent = "هذا الحساب ليس أدمن";
    await signOut(auth); return;
  }
  $("login").hidden = true; $("app").hidden = false;
  load();
});

async function load() {
  const snap = await getDocs(query(collection(db, "users"), orderBy("createdAt", "desc")));
  users = snap.docs.map(d => ({ id: d.id, ...d.data() }));
  $("sUsers").textContent = users.length;
  $("sBanned").textContent = users.filter(u => u.banned).length;
  $("sAdmins").textContent = users.filter(u => u.isAdmin).length;
  try { $("sChats").textContent = (await getCountFromServer(collection(db, "chats"))).data().count; } catch { $("sChats").textContent = "-"; }
  render();
}

function btn(text, cls, fn) { const b = document.createElement("button"); b.textContent = text; if (cls) b.className = cls; b.onclick = fn; b.style.marginInlineEnd = "4px"; return b; }

function render() {
  const q = $("search").value.trim().toLowerCase();
  const tbody = $("rows"); tbody.replaceChildren();
  for (const u of users.filter(u => (u.name + " " + u.email).toLowerCase().includes(q))) {
    const tr = document.createElement("tr");
    const c1 = document.createElement("td");
    const av = document.createElement("span"); av.className = "av";
    if (u.photoUrl) { const im = document.createElement("img"); im.src = u.photoUrl; av.append(im); } else av.textContent = (u.name || "?")[0];
    c1.append(av, document.createTextNode(u.name || ""));
    const c2 = document.createElement("td"); c2.textContent = u.email || "";
    const c3 = document.createElement("td");
    const t = document.createElement("span");
    t.className = "tag " + (u.banned ? "red" : "green"); t.textContent = u.banned ? "محظور" : "نشط";
    c3.append(t);
    if (u.isAdmin) { const a = document.createElement("span"); a.className = "tag"; a.textContent = "أدمن"; a.style.marginInlineStart = "6px"; c3.append(a); }
    const c4 = document.createElement("td");
    c4.append(
      btn(u.banned ? "إلغاء الحظر" : "حظر", u.banned ? "" : "red", async () => { await updateDoc(doc(db, "users", u.id), { banned: !u.banned }); load(); }),
      btn(u.isAdmin ? "سحب الأدمن" : "ترقية لأدمن", "gray", async () => { if (confirm("تأكيد؟")) { await updateDoc(doc(db, "users", u.id), { isAdmin: !u.isAdmin }); load(); } }),
      btn("حذف", "red", async () => { if (confirm("حذف بيانات المستخدم " + u.name + "؟\n(حساب الدخول نفسه يُحذف من Firebase Console > Authentication)")) { await deleteDoc(doc(db, "users", u.id)); load(); } })
    );
    tr.append(c1, c2, c3, c4); tbody.append(tr);
  }
}
$("search").oninput = render;
</script>
</body>
</html>
